<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tanıtım filmi yazı katmanı</title>
<!-- Filmin üst katmanı: yazı şeritleri, kasaba görselleri ve kararmalar. Her kare yalnızca zamanın
     işlevidir: kurgu.py `kare(t)` çağırır ve saydam PNG alır. Plan /plan.json adresinden gelir
     (tuval boyutu da oradadır: yatay 1920x1080, dikey 1080x1920). -->
<style>
@font-face { font-family: "Daktilo"; src: url("/assets/font/CourierPrime-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Serif"; src: url("/assets/font/OldStandard-Bold.ttf"); font-weight: 700; }
html, body { margin: 0; background: transparent; overflow: hidden; }
#sahne { position: relative; overflow: hidden; }
.kutu { position: absolute; overflow: hidden; }
.kutu img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; will-change: transform; }
.kutu .golge { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(to top, rgba(20,16,12,.55), rgba(20,16,12,0)); }
.serit { position: absolute; transform-origin: 50% 50%; padding: 20px 38px 14px; background: linear-gradient(#f4ebd2, #ecdfbe);
	border: 2px solid rgba(74,50,34,.55); box-shadow: 0 10px 26px rgba(15,10,6,.5), 0 2px 0 rgba(255,255,255,.35) inset;
	font: 700 62px/1.12 "Daktilo", monospace; color: #2a2622; white-space: nowrap; letter-spacing: -0.5px; }
.serit .satir { display: block; }
.serit .kucuk { font-size: .9em; color: #5c544b; margin-bottom: 6px; }
.serit .vurgu { color: #7a1f2b; }
.serit .not { font-size: 19px; letter-spacing: 0; color: #5c544b; margin-top: 12px; }
.serit i { font-style: normal; visibility: hidden; }
.serit i.acik { visibility: visible; }
.yil { position: absolute; font: 700 300px/1 "Serif", serif; color: #f4efe0; letter-spacing: 6px;
	text-shadow: 0 6px 0 rgba(31,27,23,.55), 0 14px 40px rgba(15,10,6,.6); }
.yil i { font-style: normal; visibility: hidden; }
.yil i.acik { visibility: visible; }
.duz { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; line-height: 1; white-space: nowrap; }
#perde { position: absolute; inset: 0; background: #14100c; opacity: 0; }
</style>
</head>
<body>
<div id="sahne"></div>
<script>
let plan = null;
const sahne = document.getElementById("sahne");

function harfler(metin) {
	// her harf ayrı <i>: yazılmamış harfler yer tutar, şerit yazarken oynamaz
	return [...metin].map(h => "<i>" + (h === " " ? "&nbsp;" : h) + "</i>").join("");
}

async function kur() {
	plan = await (await fetch("/plan.json")).json();
	sahne.style.width = plan.tuval[0] + "px";
	sahne.style.height = plan.tuval[1] + "px";
	for (const r of plan.resimler) {
		const k = document.createElement("div");
		k.className = "kutu";
		k.style.left = r.kutu[0] + "px"; k.style.top = r.kutu[1] + "px";
		k.style.width = r.kutu[2] + "px"; k.style.height = r.kutu[3] + "px";
		k.style.display = "none";
		const e = document.createElement("img");
		e.src = r.yol; e.style.objectPosition = r.odak || "50% 50%";
		k.appendChild(e);
		const g = document.createElement("div"); g.className = "golge"; k.appendChild(g);
		sahne.appendChild(k); r.k = k; r.e = e;
		await e.decode();
	}
	await document.fonts.load('700 40px "Daktilo"');
	await document.fonts.load('700 40px "Serif"');
	for (const y of plan.yazilar) {
		const e = document.createElement("div");
		e.className = y.tur;
		if (y.tur === "duz") {
			e.textContent = y.satirlar[0].metin;
			e.style.fontFamily = '"' + y.font + '", monospace';
			e.style.color = y.renk; e.style.letterSpacing = (y.aralik || 0) + "px";
		} else {
			e.innerHTML = y.satirlar.map(s => '<span class="satir' + (s.kucuk ? " kucuk" : "") + (s.vurgu ? " vurgu" : "") + (s.not ? " not" : "") + '">'
				+ (s.not ? s.metin : harfler(s.metin)) + "</span>").join("");
		}
		if (y.punto) e.style.fontSize = y.punto + "px";
		sahne.appendChild(e);
		y.e = e; y.h = [...e.querySelectorAll("i")];
		// konum: (x, y) şeridin ortası; düz satırda y üst kenardır
		const k = e.getBoundingClientRect();
		if (y.tur === "duz") e.style.top = y.y + "px";
		else { e.style.left = Math.round(y.x - k.width / 2) + "px"; e.style.top = Math.round(y.y - k.height / 2) + "px"; }
		e.style.display = "none";
	}
	const p = document.createElement("div"); p.id = "perde"; sahne.appendChild(p); plan.perde = p;
	await document.fonts.ready;
	return "hazır " + plan.bicim + " " + plan.tuval.join("x");
}

function yumusak(k) { k = Math.max(0, Math.min(1, k)); return k * k * (3 - 2 * k); }

// t anındaki kareyi kurar; değişmeyen karelerde aynı imzayı döndürür (kurgu.py dosyayı yeniden çekmez)
function kare(t) {
	const imza = [];
	for (const r of plan.resimler) {
		const acik = t >= r.t0 && t < r.t1;
		r.k.style.display = acik ? "block" : "none";
		if (acik) {
			const k = (t - r.t0) / (r.t1 - r.t0);
			const o = r.olcek[0] + (r.olcek[1] - r.olcek[0]) * k;
			const x = r.kay[0] * (1 - k) + r.kay[2] * k, y = r.kay[1] * (1 - k) + r.kay[3] * k;
			r.e.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + o.toFixed(5) + ")";
			imza.push("r" + r.yol + k.toFixed(5));
		}
	}
	plan.yazilar.forEach((y, no) => {
		const acik = t >= y.t0 && t < y.t1;
		y.e.style.display = acik ? "block" : "none";
		if (!acik) return;
		if (y.tur === "duz") { imza.push("d" + no); return; }
		const gecen = t - y.t0;
		let n = y.h.length;
		if (y.hiz > 0) n = Math.min(n, Math.floor((gecen - (y.gecikme || 0)) * y.hiz) + 1);
		if (gecen < (y.gecikme || 0)) n = 0;
		y.h.forEach((h, i) => h.classList.toggle("acik", i < n));
		// giriş: kısa bir düşme ve yerine oturma
		const g = yumusak(gecen / 0.16);
		y.e.style.opacity = g.toFixed(3);
		y.e.style.transform = "translateY(" + ((1 - g) * 26).toFixed(2) + "px) rotate(" + (y.aci || 0) + "deg) scale(" + (1.04 - 0.04 * g).toFixed(4) + ")";
		imza.push("y" + no + ":" + n + ":" + g.toFixed(3));
	});
	let p = 0;
	for (const k of plan.kararmalar) {
		if (t >= k.t0 && t <= k.t1) p = Math.max(p, k.yon > 0 ? yumusak((t - k.t0) / (k.t1 - k.t0)) : 1 - yumusak((t - k.t0) / (k.t1 - k.t0)));
	}
	plan.perde.style.opacity = p.toFixed(3);
	imza.push("p" + p.toFixed(3));
	return imza.join("|");
}
</script>
</body>
</html>
